# S3 server for the tests of the S3 storage (npm run test:s3): Scality CloudServer, in memory. Unlike Garage, it
# applies the per-object ACLs and serves public objects anonymously, as Exoscale SOS does in production. The bucket
# is created by the tests (test/environment/s3-global-setup.ts).
services:
  s3:
    image: ghcr.io/scality/cloudserver:9.5.5@sha256:d4bacb4665468fa902fc9c99346c09c2c01d5e1745db200118cfca8595e98709
    environment:
      S3BACKEND: mem
      REMOTE_MANAGEMENT_DISABLE: '1'
      # the credentials of test/environment/env-vars.s3.mjs
      SCALITY_ACCESS_KEY_ID: tracking-access-key
      SCALITY_SECRET_ACCESS_KEY: tracking-secret-key
    ports:
      - 9000:8000
